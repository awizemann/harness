<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run a User Test</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f8;
    --panel: #ffffff;
    --panel-2: #fbfbfd;
    --text: #1c1c1e;
    --muted: #6c6c72;
    --line: rgba(0,0,0,0.10);
    --line-strong: rgba(0,0,0,0.16);
    --accent: #0a72e8;
    --accent-text: #ffffff;
    --chip: rgba(0,0,0,0.045);
    --chip-hover: rgba(0,0,0,0.075);
    --shadow: 0 1px 2px rgba(0,0,0,0.06), 0 6px 20px rgba(0,0,0,0.05);
    --ok: #1a7f37;
    --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1c;
      --panel: #232326;
      --panel-2: #27272b;
      --text: #f2f2f5;
      --muted: #9a9aa2;
      --line: rgba(255,255,255,0.10);
      --line-strong: rgba(255,255,255,0.18);
      --accent: #3b93ff;
      --accent-text: #0b1220;
      --chip: rgba(255,255,255,0.06);
      --chip-hover: rgba(255,255,255,0.11);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
      --ok: #4ec97a;
      --err: #ff6b5e;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 18px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    max-width: 460px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }
  h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }

  .body { padding: 14px 16px 16px; }

  .field { margin-bottom: 14px; }
  .field:last-of-type { margin-bottom: 0; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    min-height: 56px;
    resize: vertical;
    padding: 8px 10px;
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .chip {
    font: inherit;
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--chip);
    color: var(--muted);
    cursor: pointer;
  }
  .chip:hover { background: var(--chip-hover); color: var(--text); }

  .seg {
    display: flex;
    gap: 2px;
    padding: 2px;
    background: var(--chip);
    border-radius: 8px;
  }
  .seg button {
    flex: 1;
    font: inherit;
    font-size: 12px;
    padding: 5px 6px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] {
    background: var(--panel);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }

  .run {
    margin-top: 16px;
    width: 100%;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 12px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  .run:hover { filter: brightness(1.06); }
  .run:disabled { opacity: 0.55; cursor: default; filter: none; }

  .status {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.busy .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .status.ok .dot { background: var(--ok); }
  .status.err .dot { background: var(--err); }
  .status.err { color: var(--err); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  pre.out {
    margin: 10px 0 0;
    padding: 9px 10px;
    max-height: 190px;
    overflow: auto;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }
  pre.out:empty { display: none; }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>Run a User Test</h1>
    <p>Send a goal and a persona to the agent — it drives the target with <code>harness-cli</code>.</p>
  </header>

  <div class="body">
    <div class="field">
      <label for="goal">Goal</label>
      <textarea id="goal" placeholder="What should the simulated user try to do?"></textarea>
      <div class="chips" id="presets"></div>
    </div>

    <div class="field">
      <label>Persona</label>
      <div class="seg" id="persona"></div>
    </div>

    <div class="field">
      <label>Target</label>
      <div class="seg" id="target"></div>
    </div>

    <button class="run" id="run">Run user test</button>

    <div class="status" id="status"><span class="dot"></span><span id="statusText">Ready</span></div>
    <pre class="out" id="out"></pre>
  </div>
</div>

<script>
(function () {
  "use strict";

  var PRESETS = [
    "Sign up and create my first list",
    "Delete my account",
    "Find a vegetarian restaurant and save it"
  ];

  var PERSONAS = [
    { id: "first-time", label: "First-time user",
      text: "A curious first-time user who reads labels carefully but has never seen this app before and has no manual." },
    { id: "power", label: "Power user",
      text: "An impatient power user who expects keyboard shortcuts and the shortest path, and skips onboarding." },
    { id: "distracted", label: "Distracted user",
      text: "A distracted user on their phone between tasks, skimming rather than reading and easily derailed." }
  ];

  var TARGETS = [
    { id: "ios", label: "iOS Simulator",
      flags: "--platform ios --project-path <PATH/TO/.xcodeproj> --scheme <SCHEME> --simulator-udid <UDID>" },
    { id: "macos", label: "macOS",
      flags: "--platform macos --app-path <PATH/TO/App.app>" },
    { id: "web", label: "Web",
      flags: "--platform web --url <TARGET_URL>" }
  ];

  var scarf = window.scarf;
  var state = { persona: "first-time", target: "ios", busy: false };

  var $goal = document.getElementById("goal");
  var $out = document.getElementById("out");
  var $status = document.getElementById("status");
  var $statusText = document.getElementById("statusText");
  var $run = document.getElementById("run");

  function setStatus(text, kind) {
    $statusText.textContent = text;
    $status.className = "status" + (kind ? " " + kind : "");
  }

  function log(line) {
    $out.textContent += ($out.textContent ? "\n" : "") + line;
    $out.scrollTop = $out.scrollHeight;
  }

  // --- Presets -------------------------------------------------------
  var $presets = document.getElementById("presets");
  PRESETS.forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = p;
    b.addEventListener("click", function () { $goal.value = p; $goal.focus(); save(); });
    $presets.appendChild(b);
  });

  // --- Segmented pickers ---------------------------------------------
  function buildSeg(hostId, items, key) {
    var host = document.getElementById(hostId);
    items.forEach(function (item) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = item.label;
      b.dataset.id = item.id;
      b.setAttribute("aria-pressed", String(state[key] === item.id));
      b.addEventListener("click", function () {
        state[key] = item.id;
        Array.prototype.forEach.call(host.children, function (c) {
          c.setAttribute("aria-pressed", String(c.dataset.id === item.id));
        });
        save();
      });
      host.appendChild(b);
    });
    return host;
  }
  var $personaSeg = buildSeg("persona", PERSONAS, "persona");
  var $targetSeg = buildSeg("target", TARGETS, "target");

  function syncSeg(host, key) {
    Array.prototype.forEach.call(host.children, function (c) {
      c.setAttribute("aria-pressed", String(c.dataset.id === state[key]));
    });
  }

  function find(list, id) {
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
    return list[0];
  }

  // --- Persistence (permission: store) --------------------------------
  function save() {
    if (!scarf || !scarf.store) return;
    scarf.store.set("lastRun", {
      goal: $goal.value, persona: state.persona, target: state.target
    }).catch(function () { /* store not granted — settings just won't persist */ });
  }

  function restore() {
    if (!scarf || !scarf.store) return Promise.resolve();
    return scarf.store.get("lastRun").then(function (v) {
      if (!v) return;
      if (typeof v.goal === "string") $goal.value = v.goal;
      if (typeof v.persona === "string") { state.persona = v.persona; syncSeg($personaSeg, "persona"); }
      if (typeof v.target === "string") { state.target = v.target; syncSeg($targetSeg, "target"); }
    }).catch(function () {});
  }

  // --- Prompt construction --------------------------------------------
  function buildPrompt(goal) {
    var persona = find(PERSONAS, state.persona);
    var target = find(TARGETS, state.target);
    var root = (scarf && scarf.context && scarf.context.projectRoot) || ".";

    return [
      "Run a Harness user test with the harness-cli driver.",
      "",
      "Goal: " + goal,
      "Persona (" + persona.label + "): " + persona.text,
      "Target: " + target.label,
      "",
      "Steps:",
      "1. Build the driver from the repo root (" + root + "):",
      "   xcodebuild -project Harness.xcodeproj -scheme HarnessCLI -derivedDataPath build build",
      "2. Run it, filling in the placeholders below from the repo/target you are testing:",
      "   ./build/Build/Products/Debug/harness-cli \\",
      "     --goal \"" + goal.replace(/"/g, "'") + "\" \\",
      "     --persona \"" + persona.text.replace(/"/g, "'") + "\" \\",
      "     " + target.flags + " \\",
      "     --provider anthropic --model claude-sonnet-4-6 \\",
      "     --output ./runs/$(date +%Y%m%d-%H%M%S)",
      "3. Read the run's events.jsonl and meta.json from the --output directory.",
      "",
      "Then report: did the goal complete, the path of screens and actions taken,",
      "and every friction event with its timestamp. Keep the summary under 10 lines."
    ].join("\n");
  }

  // --- Run -------------------------------------------------------------
  function run() {
    var goal = $goal.value.trim();
    if (!goal) { setStatus("Enter a goal first", "err"); $goal.focus(); return; }
    if (state.busy) return;
    if (!scarf || typeof scarf.prompt !== "function") {
      setStatus("Bridge unavailable — open this from Scarf", "err");
      return;
    }

    state.busy = true;
    $run.disabled = true;
    $out.textContent = "";
    setStatus("Sending to the agent…", "busy");
    save();

    scarf.prompt(buildPrompt(goal)).then(function (result) {
      setStatus("Run requested", "ok");
      if (result) log(String(result));
    }).catch(function (err) {
      setStatus("Failed: " + (err && err.message ? err.message : String(err)), "err");
    }).then(function () {
      state.busy = false;
      $run.disabled = false;
    });
  }

  $run.addEventListener("click", run);
  $goal.addEventListener("input", save);
  $goal.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); run(); }
  });

  // --- Live agent output (permission: events) --------------------------
  if (scarf && typeof scarf.onEvent === "function") {
    try {
      scarf.onEvent(function (ev) {
        if (!ev) return;
        if (ev.type === "message" && ev.text) log(ev.text);
        else if (ev.type === "tool" && ev.title) log("· " + ev.title);
        else if (ev.type === "complete") setStatus("Done", "ok");
      });
    } catch (e) { /* events not granted — the panel still runs, just without streaming */ }
  }

  if (scarf && scarf.ui && typeof scarf.ui.setTitle === "function") {
    try { scarf.ui.setTitle("Run a User Test"); } catch (e) {}
  }

  restore();
  if (!scarf) setStatus("Preview mode — bridge unavailable", "err");
})();
</script>
</body>
</html>

# Minimal iOS Simulator fixture app for the harness-mcp step-session proofs.
#
# A single SwiftUI screen with an accessible button that toggles a label — just
# enough surface for an iOS UI session to observe a mark, act (tap_mark), and
# see the resulting state change. Built by the harness with ad-hoc simulator
# signing (CODE_SIGN_IDENTITY=-, DEVELOPMENT_TEAM=), so it needs no Apple team.
#
# Regenerate the .xcodeproj after editing this file:
#   (cd HarnessMCP/fixtures/ios-app && xcodegen generate)
name: HarnessUITestFixture
options:
  bundleIdPrefix: com.harness.fixture
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.harness.fixture.uitest
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
targets:
  HarnessUITestFixture:
    type: application
    platform: iOS
    sources:
      - path: Sources
schemes:
  HarnessUITestFixture:
    build:
      targets:
        HarnessUITestFixture: all
    run:
      config: Debug
